# Author-provided sample, explicitly selected for this demonstration.
version: 1
id: symwrite-research-demo
name: Avalon invitation
synthetic: false
style:
  "Continue the second draft of an invitation in an exuberant, theatrical voice. Use the author's
  first draft as the writing reference: direct invitations, playful lists, emphatic declarations,
  and a sense of shared merriment. Keep the invitation readable rather than filling it with invented
  archaic language. Preserve the stated costume requirement and presentation time. Work the fiddle
  and duel into the invitation naturally. Do not invent a date, address, admission price, RSVP deadline,
  or additional event logistics. Return only new text after the second draft's opening, without repeating
  the first draft, revision notes, or heading."
models:
  candidate:
    provider: openrouter
    model: qwen/qwen3-30b-a3b-instruct-2507
    temperature: 0.85
    max_tokens: 400
  synthesis:
    provider: openrouter
    model: deepseek/deepseek-chat-v3.1
    temperature: 0.45
    max_tokens: 500
  candidate_count: 5
sources:
  - id: avalon-first-draft
    title: Avalon invitation — first draft
    kind: writing
    text:
      "Join Avalon for a night of revelry in honor of one of the great masters of the English language.
      Drinking, declamations of sonnets, duels, dancing, and many other forms of merriment to be provided.
      Costumes mandatory! Come as a Roman, a faerie or a nymph, medieval nobility, in a carnival mask,
      or anything else drawn from his settings or characters. Those without a costume will be turned
      away, be sure to tell anyone you invite!


      Sonnets and memorized monologues will be presented around 9:30. If you would like to prepare and
      present something, let me know!"
  - id: avalon-revision-notes
    title: Notes for the second draft
    kind: fact
    text: there will be a fiddle and a duel.
  - id: avalon-costumes
    title: Costume requirement
    kind: fact
    text:
      Costumes are mandatory. Those without a costume will be turned away. Guests should tell anyone
      they invite. Suggested costumes include a Roman, a faerie or a nymph, medieval nobility, a carnival
      mask, or something drawn from the celebrated writer's settings or characters.
  - id: avalon-readings
    title: Sonnets and monologues
    kind: fact
    text:
      Sonnets and memorized monologues will be presented around 9:30. Anyone who would like to prepare
      and present something should let the organizer know.
